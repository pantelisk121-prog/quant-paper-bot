name: Run Retail Paper Bot Daily

on:
  schedule:
    - cron: '35 20 * * 1-5'  # 4:35 PM EDT (avoids top-of-hour GitHub queue delays)
  workflow_dispatch:

env:
  TZ: America/New_York  # Forces all Linux & Python timestamps to US Eastern Market Time

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas statsmodels numpy

      - name: Run Paper Bot Engine (Weekdays Only in US Market Time)
        run: |
          if [ $(date +%u) -le 5 ]; then
            python retail_paper_bot.py
          else
            echo "Weekend in New York detected — skipping retail_paper_bot.py."
          fi

      - name: Evaluate Metrics & Build Tables
        run: |
          python evaluate_metrics.py
          if [ -f METRICS.md ]; then
            cat METRICS.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push Updated Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git commit -m "Auto-update paper portfolio logs [skip ci]" || exit 0
          git push
