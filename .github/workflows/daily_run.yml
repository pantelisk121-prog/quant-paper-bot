name: Run Retail Paper Bot Daily

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas statsmodels numpy

      - name: Run Paper Bot Engine
        run: python retail_paper_bot.py

      - name: Evaluate Metrics
        run: python evaluate_metrics.py

      - name: Commit and Push Updated Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git commit -m "Auto-update paper portfolio logs [skip ci]" || exit 0
          git push
